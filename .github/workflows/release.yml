name: Release

# Push a tag named after the package version (e.g. v1.001) to build both families
# and attach them to a draft release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-groups --locked
      - name: Check that the tag matches the package version
        run: |
          version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi
      - run: make download
      - run: make test
      - run: make run
      - run: make package
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip fonts/*.ttc \
            --draft --title "Hangyeol Code ${GITHUB_REF_NAME#v}" --generate-notes
